<!-- 
 This file contains the structure for the main register page of the Recipe Management Application,
 providing a user registration form with fields for username, email, and password.
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - User Registration Page</title>
    <link rel="stylesheet" href="register-page.css">
</head>
<body>

    <!-- Register heading -->
    <h1>Register</h1>
    <!-- Username paragraph -->
    <p>Username</p>
    <!-- Username input -->
     <input type="text" id="username-input">
    <!-- Email paragraph -->
     <p>Email</p>
    <!-- Email input -->
    <input type="email" id="email-input">
    <!-- Password paragraph -->
     <p>Password</p>
    <!-- Password input -->
    <input type="password" id="password-input">
    <!-- Repeat Password Paragraph -->
     <p>Repeat Password</p>
    <!-- TODO: Add an input element for repeat password with id="repeat-password-input" and type="password" -->
    <input type="password" id="repeat-password-input">
    <!-- Register button -->
     <button id="register-button">Register</button>
    <script src="register-page.js"></script>
</body>
</html>
