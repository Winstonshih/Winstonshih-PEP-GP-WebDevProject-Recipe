<!-- 
 This file contains the structure for the login page of the Recipe Management Application.
 It provides a form for users to enter their credentials and log into the system.
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Recipe Management App</title>
</head>
<body>

    <!-- Main heading for the page -->
     <h1>Recipe Management App Login</h1>
    <!-- An input field for username -->
     <input type="text"id="login-input" placeholder="Input username">
    <!-- An input field for password -->
     <input type="password" id="password-input" placeholder="Input password"> 
    <!-- A login button -->
     <button id="login-button">Login</button>
    <!-- TODO: Add an optional hidden logout button with id="logout-button" -->
    <button id="logout-button" style="display:none">Logout</button>
    <!-- Link JS script -->
    <script src="login-page.js"></script>
</body>
</html>
