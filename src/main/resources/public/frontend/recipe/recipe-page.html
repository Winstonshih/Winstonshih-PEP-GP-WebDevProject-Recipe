<!-- 
 This file contains the structure for the main recipe management page of the Recipe Management Application.
 It provides interfaces for viewing, adding, updating, deleting, and searching recipes.
-->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipes - Recipe Management App</title>
    <link rel="stylesheet" href="recipe-page.css">
</head>

<body>

    <!-- A hidden link to navigate to the ingredients page (admin only).-->
    <a href="../ingredients/ingredient-page.html" id="admin-link" >Go to ingredients</a>
    <!-- Hidden log out button. -->
     <button id="logout-button" style="display:none">Log Out</button>
    <!-- Heading for the Recipe Management section -->
     <h1>Recipes</h1>

    <!-- 🔍 Search a Recipe section -->
    <h2>Search a Recipe</h2>
    <input id="search-input">
    <Button id="search-button">Search</Button>

    <!-- 📋 Recipe List section-->
    <ul id="recipe-list"></ul>

    <!-- ➕ Add a Recipe section-->
    <h2>Add a Recipe</h2>
    <input id="add-recipe-name-input">
    <textarea id="add-recipe-instructions-input">Add Recipe</textarea>
    <Button id="add-recipe-submit-input">Add Recipe</Button>
    <!-- ✏️ Update a Recipe section-->
    <h2>Update a Recipe</h2>
    <input id="update-recipe-name-input">
    <textarea id="update-recipe-instructions-input">Update Recipe</textarea>
    <Button id="update-recipe-submit-input">Update Recipe</Button>
    <!-- ❌ Delete a Recipe section-->
    <h2>Delete a Recipe</h2>
    <input id="delete-recipe-name-input">
    <Button id="delete-recipe-submit-input">Delete Recipe</Button>
    <script src="recipe-page.js"></script>
</body>

</html>
